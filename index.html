<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wildchild Blog</title>
  {% unless jekyll.environment == "development" %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% endunless %}
</head>
<body>
  <div id="react-blog-home-root"></div>
  {% if jekyll.environment == "development" %}
  <script type="module">
    import RefreshRuntime from "http://127.0.0.1:5173/@react-refresh";
    RefreshRuntime.injectIntoGlobalHook(window);
    window.$RefreshReg$ = () => {};
    window.$RefreshSig$ = () => (type) => type;
    window.__vite_plugin_react_preamble_installed__ = true;
  </script>
  <script type="module" src="http://127.0.0.1:5173/@vite/client"></script>
  <script type="module" src="http://127.0.0.1:5173/src/main.tsx"></script>
  {% else %}
  <script src="{{ '/assets/js/blog-app.js' | relative_url }}"></script>
  {% endif %}
</body>
</html>
